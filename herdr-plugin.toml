# Shepherd as a herdr plugin: herdr installs the host, starts it in the
# background when the herdr server starts, and opens the Shepherd window
# (status, pairing, phones, log) in a pane. See "Install as a herdr plugin" in the README.
id = "shepherd"
name = "Shepherd"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Check on and steer your agents from your phone"
platforms = ["linux", "macos"]

# Only the host's dependencies, not the mobile app's.
[[build]]
command = ["npm", "ci", "--workspace", "@shepherd/host", "--omit=dev", "--no-audit", "--no-fund"]

# Exits straight away: starts the host in the background unless it's already
# running (or the launchd/systemd service runs it). The host stops when herdr does.
[[startup]]
command = ["node", "apps/host/src/cli.ts", "ensure"]

# Each opens the Shepherd window on its own screen.
[[actions]]
id = "open"
title = "Shepherd"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint window --focus"]

[[actions]]
id = "pair"
title = "Shepherd: pair a phone"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint window --focus --env SHEPHERD_SCREEN=pair"]

[[actions]]
id = "restart"
title = "Shepherd: restart the host"
command = ["node", "apps/host/src/cli.ts", "restart"]

[[panes]]
id = "window"
title = "Shepherd"
placement = "overlay"
command = ["node", "apps/host/src/cli.ts", "ui"]
