plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.shepherd.background'
version = '0.1.0'

android {
  namespace "dev.shepherd.background"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Headless JS: keeps React Native's timers running while the app is in the background.
  implementation 'com.facebook.react:react-android'
}
